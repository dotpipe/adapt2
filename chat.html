<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Interface</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
        #chatWindow { height: 400px; border: 1px solid #ddd; overflow-y: auto; padding: 10px; margin-bottom: 10px; }
        #messageInput { width: 80%; padding: 8px; }
        button { padding: 8px; background-color: #4CAF50; color: white; border: none; cursor: pointer; }
        .message { margin-bottom: 10px; }
        .visitor { text-align: right; color: blue; }
        .store { text-align: left; color: green; }
        .internal { text-align: left; color: red; font-style: italic; }
    </style>
</head>
<body>
    <h1>Chat Interface</h1>
    <div id="chatWindow"></div>
    <input type="text" id="messageInput" placeholder="Type your message...">
    <button id="sendBtn">Send</button>
    <button id="holdBtn">Put on Hold</button>
    <button id="forwardBtn">Forward</button>

    <script>
        let chatId = null;
        const chatWindow = document.getElementById('chatWindow');
        const messageInput = document.getElementById('messageInput');

        function addMessageToChatWindow(user, message) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${user}`;
            messageDiv.textContent = `${user}: ${message}`;
            chatWindow.appendChild(messageDiv);
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        function startChat() {
            const visitorId = 'visitor' + Date.now();
            const storeZipcode = '12345'; // Example zipcode
            const storeType = 'Electronics'; // Example store type

            fetch('./api/chat.php?action=start_chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ visitor_id: visitorId, store_zipcode: storeZipcode, store_type: storeType })
            })
            .then(response => response.json())
            .then(data => {
                chatId = data.chat_id;
                addMessageToChatWindow('system', 'Chat started. Chat ID: ' + chatId);
            })
            .catch(error => console.error('Error starting chat:', error));
        }

        function sendMessage() {
            const message = messageInput.value.trim();
            if (message && chatId) {
                fetch('./api/chat.php?action=send_message', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, user: 'visitor', message: message, cussing_mode: false })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        addMessageToChatWindow('visitor', message);
                        messageInput.value = '';
                    }
                })
                .catch(error => console.error('Error sending message:', error));
            }
        }

        function putOnHold() {
            if (chatId) {
                const holdMessage = 'Please hold while we transfer you to a specialist.';
                const internalMessage = 'Customer put on hold for transfer.';
                fetch('./api/chat.php?action=put_on_hold', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, hold_message: holdMessage, internal_message: internalMessage })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        addMessageToChatWindow('store', holdMessage);
                        addMessageToChatWindow('internal', internalMessage);
                    }
                })
                .catch(error => console.error('Error putting on hold:', error));
            }
        }

        function forwardVisitor() {
            if (chatId) {
                const newStoreZipcode = '54321'; // Example new zipcode
                const newStoreType = 'Customer Service'; // Example new store type
                fetch('./api/chat.php?action=forward_visitor', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, new_store_zipcode: newStoreZipcode, new_store_type: newStoreType })
                })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        addMessageToChatWindow('system', `Forwarded to ${newStoreType} store.`);
                    }
                })
                .catch(error => console.error('Error forwarding visitor:', error));
            }
        }

        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        document.getElementById('holdBtn').addEventListener('click', putOnHold);
        document.getElementById('forwardBtn').addEventListener('click', forwardVisitor);
        messageInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });

        // Start the chat when the page loads
        startChat();
    </script>
</body>
</html>
